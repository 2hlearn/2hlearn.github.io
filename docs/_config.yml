title: 투에이치큐브
description: 투에이치큐브 소프트웨어 교육의 새로운 가능성
theme: jekyll-theme-cayman
markdown: kramdown

# 사이트 URL 설정 (배포 후 실제 도메인 또는 깃허브 URL 사용)
baseurl: "" # 루트 경로
url: "https://www.2hcube.com" # 실제 깃허브 사용자명으로 수정하세요

# 깃허브 Pages용 설정
kramdown:
  input: GFM

# 플러그인 설정 (자동 sitemap.xml 생성 및 SEO 강화)
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# 빌드 제외 목록 (옵션)
exclude:
  - README.md

# Google Analytics (선택)
# google_analytics: UA-XXXXXXXXX-X

# 로고 이미지 또는 favicon 설정 (선택)
# logo: /assets/logo.png
